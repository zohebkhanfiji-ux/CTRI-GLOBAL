# One-time, isolated audit-branch dependency lock refresh. Remove before merge.
name: CTRI refresh audit lockfile
on:
  push:
    branches:
      - audit/ctri-production-gates-2026-11-02
    paths:
      - package.json
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'zohebkhanfiji-ux/CTRI-GLOBAL'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Resolve pinned patched source map package
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit only regenerated lockfile to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(security): lock patched source-map-js 1.2.2"
            git push origin HEAD:audit/ctri-production-gates-2026-11-02
          fi
